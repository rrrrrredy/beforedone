name: Public release verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Formal SemVer release tag to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-release-verification-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  release-assets:
    name: Verify formal release assets
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Require a final SemVer release
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must be final SemVer tags such as v1.0.0."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Download and verify the complete public asset matrix
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          archives=(
            "beforedone_${version}_darwin_amd64.tar.gz"
            "beforedone_${version}_darwin_arm64.tar.gz"
            "beforedone_${version}_linux_amd64.tar.gz"
            "beforedone_${version}_linux_arm64.tar.gz"
            "beforedone_${version}_windows_amd64.zip"
            "beforedone_${version}_windows_arm64.zip"
          )
          mkdir download
          for archive in "${archives[@]}"; do
            curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors \
              --output "download/$archive" "$base/$archive"
            curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors \
              --output "download/$archive.sbom.spdx.json" \
              "$base/$archive.sbom.spdx.json"
          done
          for asset in checksums.txt beforedone.rb beforedone.json; do
            curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors \
              --output "download/$asset" "$base/$asset"
          done
          python3 scripts/validate_release_checksums.py \
            --checksums download/checksums.txt --tag "$RELEASE_TAG"
          (cd download && sha256sum --check checksums.txt)

          python3 - <<'PY'
          import json
          from pathlib import Path

          sboms = sorted(Path('download').glob('*.sbom.spdx.json'))
          if len(sboms) != 6:
              raise SystemExit(f'expected 6 SPDX documents, found {len(sboms)}')
          for path in sboms:
              with path.open(encoding='utf-8') as handle:
                  document = json.load(handle)
              if document.get('spdxVersion') != 'SPDX-2.3':
                  raise SystemExit(f'{path} is not an SPDX 2.3 document')
          PY

          ruby -c download/beforedone.rb
          python3 -m json.tool download/beforedone.json >/dev/null

          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              target="inspect/${os}-${arch}"
              mkdir -p "$target"
              if [[ "$os" == windows ]]; then
                unzip -q "download/beforedone_${version}_${os}_${arch}.zip" -d "$target"
                binary="$target/beforedone.exe"
              else
                tar -xzf "download/beforedone_${version}_${os}_${arch}.tar.gz" -C "$target"
                binary="$target/beforedone"
              fi
              metadata="$(go version -m "$binary")"
              grep -F "GOOS=$os" <<<"$metadata" >/dev/null
              grep -F "GOARCH=$arch" <<<"$metadata" >/dev/null
            done
          done
          test "$(inspect/linux-amd64/beforedone version)" = "beforedone $version"

  platform-smoke:
    name: Public smoke (${{ matrix.os }})
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'v')
    needs: release-assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_os: linux
            archive_ext: tar.gz
          - os: macos-latest
            artifact_os: darwin
            archive_ext: tar.gz
          - os: windows-latest
            artifact_os: windows
            archive_ext: zip
    steps:
      - name: Set up Go for tag-install verification
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Download public assets on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          artifact="beforedone_${version}_${{ matrix.artifact_os }}_amd64.${{ matrix.archive_ext }}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          mkdir download
          curl --fail --location --retry 5 --retry-all-errors \
            --output "download/$artifact" "$base/$artifact"
          curl --fail --location --retry 5 --retry-all-errors \
            --output download/checksums.txt "$base/checksums.txt"
          printf '%s' "$artifact" > download/artifact-name

      - name: Download public assets on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $artifact = "beforedone_${version}_${{ matrix.artifact_os }}_amd64.${{ matrix.archive_ext }}"
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          New-Item -ItemType Directory -Force download | Out-Null
          Invoke-WebRequest -Uri "$base/$artifact" -OutFile "download/$artifact"
          Invoke-WebRequest -Uri "$base/checksums.txt" -OutFile download/checksums.txt
          Set-Content -NoNewline download/artifact-name $artifact

      - name: Verify and run the public archive on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          artifact="$(cat download/artifact-name)"
          expected="$(grep "  $artifact$" download/checksums.txt | cut -d' ' -f1)"
          actual="$(sha256sum "download/$artifact" | cut -d' ' -f1)"
          test -n "$expected" && test "$actual" = "$expected"
          mkdir extracted
          tar -xzf "download/$artifact" -C extracted
          test "$(extracted/beforedone version)" = "beforedone ${RELEASE_TAG#v}"

      - name: Verify and run the public archive on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          artifact="$(cat download/artifact-name)"
          expected="$(grep "  $artifact$" download/checksums.txt | cut -d' ' -f1)"
          actual="$(shasum -a 256 "download/$artifact" | cut -d' ' -f1)"
          test -n "$expected" && test "$actual" = "$expected"
          mkdir extracted
          tar -xzf "download/$artifact" -C extracted
          test "$(extracted/beforedone version)" = "beforedone ${RELEASE_TAG#v}"

      - name: Verify and run the public archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = (Get-Content download/artifact-name -Raw).Trim()
          $line = Get-Content download/checksums.txt |
            Where-Object { $_ -match "  $([regex]::Escape($artifact))$" } |
            Select-Object -First 1
          if (-not $line) { throw "No checksum for $artifact" }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash "download/$artifact" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Checksum mismatch for $artifact" }
          Expand-Archive "download/$artifact" -DestinationPath extracted
          $reported = (& ./extracted/beforedone.exe version).Trim()
          if ($reported -ne "beforedone $($env:RELEASE_TAG.TrimStart('v'))") {
            throw "archive reported unexpected version: $reported"
          }

      - name: Verify tag-based go install on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GOPROXY: direct
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          mkdir "$RUNNER_TEMP/beforedone-go-install"
          GOBIN="$RUNNER_TEMP/beforedone-go-install" \
            go install "github.com/rrrrrredy/beforedone/cmd/beforedone@$RELEASE_TAG"
          reported="$("$RUNNER_TEMP/beforedone-go-install/beforedone" version)"
          test "$reported" = "beforedone ${RELEASE_TAG#v}"

      - name: Verify tag-based go install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOPROXY: direct
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          $env:GOBIN = Join-Path $env:RUNNER_TEMP 'beforedone-go-install'
          New-Item -ItemType Directory -Force $env:GOBIN | Out-Null
          go install "github.com/rrrrrredy/beforedone/cmd/beforedone@$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'go install failed' }
          $reported = (& (Join-Path $env:GOBIN 'beforedone.exe') version).Trim()
          if ($reported -ne "beforedone $($env:RELEASE_TAG.TrimStart('v'))") {
            throw "go install reported unexpected version: $reported"
          }
