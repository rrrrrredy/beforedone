name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Verify Go modules
        run: go mod verify

      - name: Verify generated module files are current
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify Go formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Validate adapter fixtures through the public CLI
        run: go run ./cmd/beforedone adapter test fixtures/adapters

      - name: Validate public JSON schemas
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "event.schema.json",
              "gate.schema.json",
              "receipt.schema.json",
              "incident.schema.json",
              "replay-case.schema.json",
              "adapter-manifest.schema.json",
          }
          schema_dir = Path("schemas")
          found = {path.name for path in schema_dir.glob("*.schema.json")}
          missing = sorted(expected - found)
          if missing:
              raise SystemExit(f"missing public schemas: {', '.join(missing)}")
          for path in sorted(schema_dir.glob("*.schema.json")):
              with path.open(encoding="utf-8") as handle:
                  document = json.load(handle)
              if not isinstance(document, dict):
                  raise SystemExit(f"{path} must contain a JSON object")
              if document.get("type") != "object":
                  raise SystemExit(f"{path} must declare an object root")
              print(f"validated {path}")
          PY

      - name: Check standalone and plugin skill copies for drift
        run: python scripts/sync_plugin_skills.py --check

      - name: Validate plugin, marketplace, hooks, and skills contract
        run: python scripts/validate_distribution.py

      - name: Test formal release checksum contract
        run: python scripts/test_validate_release_checksums.py

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check

  platform-tests:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python for distribution smoke helpers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Test
        run: go test -count=1 ./...

      - name: Build CLI on Unix for hook smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/beforedone-hook-bin"
          version="$(python -c 'import json; print(json.load(open("plugins/beforedone/.codex-plugin/plugin.json", encoding="utf-8"))["version"])')"
          go build -trimpath -ldflags "-X main.version=$version" -o "$RUNNER_TEMP/beforedone-hook-bin/beforedone" ./cmd/beforedone

      - name: Smoke test raw Unix hook command with CLI present and missing
        if: runner.os != 'Windows'
        shell: bash
        run: |
          command="$(python -c 'import json; print(json.load(open("plugins/beforedone/hooks/hooks.json", encoding="utf-8"))["hooks"]["Stop"][0]["hooks"][0]["command"])')"
          export PLUGIN_ROOT="$PWD/plugins/beforedone"
          payload="$(printf '{\"hook_event_name\":\"Stop\",\"session_id\":\"ci-unix\",\"cwd\":\"%s\",\"stop_hook_active\":false}' "$PWD")"

          present_output="$(printf '%s' "$payload" | PATH="$RUNNER_TEMP/beforedone-hook-bin:/usr/bin:/bin" /bin/sh -c "$command")"
          PRESENT_OUTPUT="$present_output" python - <<'PY'
          import json
          import os

          value = json.loads(os.environ["PRESENT_OUTPUT"])
          if value.get("decision") != "block" or "not configured" not in value.get("reason", ""):
              raise SystemExit(f"unexpected CLI-present hook output: {value!r}")
          PY

          missing_output="$(printf '%s' "$payload" | PATH="/usr/bin:/bin" /bin/sh -c "$command")"
          MISSING_OUTPUT="$missing_output" python - <<'PY'
          import json
          import os

          value = json.loads(os.environ["MISSING_OUTPUT"])
          message = value.get("systemMessage", "")
          if "BeforeDone CLI is required" not in message or "go install" not in message:
              raise SystemExit(f"unexpected CLI-missing hook output: {value!r}")
          PY

      - name: Build CLI on Windows for hook smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'beforedone-hook-bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          $version = (Get-Content plugins/beforedone/.codex-plugin/plugin.json -Raw | ConvertFrom-Json).version
          go build -trimpath -ldflags "-X main.version=$version" -o (Join-Path $bin 'beforedone.exe') ./cmd/beforedone

      - name: Smoke test raw Windows hook command with CLI present and missing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hooks = Get-Content plugins/beforedone/hooks/hooks.json -Raw | ConvertFrom-Json
          $command = $hooks.hooks.Stop[0].hooks[0].commandWindows
          $pluginRoot = (Resolve-Path plugins/beforedone).Path
          $payload = @{
            hook_event_name = 'Stop'
            session_id = 'ci-windows'
            cwd = $env:GITHUB_WORKSPACE
            stop_hook_active = $false
          } | ConvertTo-Json -Compress

          function Invoke-RawHook([string] $ProcessPath, [string] $InputJson) {
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = Join-Path $PSHOME 'pwsh.exe'
            $start.UseShellExecute = $false
            $start.RedirectStandardInput = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.CreateNoWindow = $true
            $start.WorkingDirectory = $env:GITHUB_WORKSPACE
            $start.ArgumentList.Add('-NoLogo')
            $start.ArgumentList.Add('-NoProfile')
            $start.ArgumentList.Add('-NonInteractive')
            $start.ArgumentList.Add('-Command')
            $start.ArgumentList.Add($command)
            $start.Environment['PLUGIN_ROOT'] = $pluginRoot
            $start.Environment['PATH'] = $ProcessPath
            $process = [Diagnostics.Process]::Start($start)
            $process.StandardInput.Write($InputJson)
            $process.StandardInput.Close()
            $stdout = $process.StandardOutput.ReadToEnd()
            $stderr = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) {
              throw "hook exited $($process.ExitCode): $stderr"
            }
            if ($stderr) {
              throw "hook wrote unexpected stderr: $stderr"
            }
            return $stdout.Trim()
          }

          $bin = Join-Path $env:RUNNER_TEMP 'beforedone-hook-bin'
          $safePath = (($env:PATH -split ';') | Where-Object {
            $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'beforedone.exe') -PathType Leaf)
          }) -join ';'
          $present = Invoke-RawHook "$bin;$safePath" $payload | ConvertFrom-Json
          if ($present.decision -ne 'block' -or $present.reason -notmatch 'not configured') {
            throw "unexpected CLI-present hook output: $($present | ConvertTo-Json -Compress)"
          }

          $missing = Invoke-RawHook $safePath $payload | ConvertFrom-Json
          if ($missing.systemMessage -notmatch 'BeforeDone CLI is required' -or $missing.systemMessage -notmatch 'go install') {
            throw "unexpected CLI-missing hook output: $($missing | ConvertTo-Json -Compress)"
          }

  deepseek-harness-bundle:
    name: DSH Bundle (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["22.19.0", "24"]

    defaults:
      run:
        working-directory: integrations/deepseek-harness

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: integrations/deepseek-harness/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Bundle dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Bundle unit and Cordis lifecycle tests
        run: pnpm verify

      - name: Build current BeforeDone CLI
        shell: pwsh
        working-directory: .
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'beforedone-cli'
          New-Item -ItemType Directory -Force $bin | Out-Null
          $name = if ($IsWindows) { 'beforedone.exe' } else { 'beforedone' }
          $cli = Join-Path $bin $name
          go build -trimpath -ldflags '-X main.version=1.1.1-dev' -o $cli ./cmd/beforedone
          "BEFOREDONE_CLI=$cli" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run real SessionStore and local CLI integration
        shell: pwsh
        run: |
          $env:BEFOREDONE_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'dsh-beforedone-integration'
          pnpm test:integration

      - name: Pack release candidate
        run: pnpm pack --pack-destination .pack

  deepseek-harness-e2e:
    name: DSH E2E (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "22.19.0"
          - os: windows-latest
            node-version: "24"

    defaults:
      run:
        working-directory: integrations/deepseek-harness

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: integrations/deepseek-harness/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Bundle dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI and pack Bundle
        shell: pwsh
        run: |
          pnpm pack --pack-destination .pack
          $bin = Join-Path $env:RUNNER_TEMP 'beforedone-cli'
          New-Item -ItemType Directory -Force $bin | Out-Null
          $name = if ($IsWindows) { 'beforedone.exe' } else { 'beforedone' }
          $cli = Join-Path $bin $name
          Push-Location ../..
          go build -trimpath -ldflags '-X main.version=1.1.1-dev' -o $cli ./cmd/beforedone
          Pop-Location
          "BEFOREDONE_CLI=$cli" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install isolated DeepSeek Harness runtime
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'dsh-runtime'
          New-Item -ItemType Directory -Force $runtimeRoot | Out-Null
          Push-Location $runtimeRoot
          pnpm init | Out-Null
          pnpm `
            --allow-build='@deepseek-ai/dsh-subprocess-local' `
            --allow-build='@google/genai' `
            --allow-build='koffi' `
            --allow-build='node-pty' `
            --allow-build='protobufjs' `
            add --save-exact '@deepseek-ai/dsh@0.1.0-rc.6'
          pnpm ignored-builds
          Pop-Location

      - name: Run deterministic install, gate, steering, and removal E2E
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'dsh-runtime'
          $tarball = (Get-ChildItem .pack -Filter 'dsh-beforedone-*.tgz' | Select-Object -First 1).FullName
          $env:DSH_ENTRY = Join-Path $runtimeRoot 'node_modules/@deepseek-ai/dsh/lib/bin.js'
          $env:DSH_TARBALL = $tarball
          $env:DSH_E2E_ROOT = Join-Path $env:RUNNER_TEMP 'dsh-beforedone-e2e'
          pnpm test:e2e:dsh
